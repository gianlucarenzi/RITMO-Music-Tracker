name: Build RITMO on Linux (other architectures)

# The Qt6 frontend for the Linux architectures that GitHub has no runner for
# and that have no AppImage: built in a Debian container of the architecture,
# emulated by QEMU (much slower than a real machine: the timeout is long),
# with the Qt 6, PortAudio and RtMidi of Debian (scripts/build-tarball.sh);
# ppc64 (big endian) is on debian-ports, which has only the unstable release (sid).
# The result is a .tar.gz with the libraries it needs and a .deb that depends on
# those of Debian (scripts/build-deb.sh), and an AppImage made from the folder
# of the .tar.gz with the ports of appimagetool and of its runtime to these
# architectures (scripts/build-appimage-ports.sh).
# A tag v* builds them and publishes them as release assets; started by hand
# it only keeps them as artifacts.

on:
  push:
    tags: ['v*']
    branches: ['ci/**']        # test runs of the workflows: the artifacts only, no release
  workflow_dispatch:           # manual test runs: the artifacts only, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            platform: linux/riscv64
            image: debian:trixie
          - arch: ppc64               # PowerPC big endian: only in debian-ports (sid)
            platform: linux/ppc64
            image: ritmo-debian-ports-ppc64
            ports: true
          - arch: ppc64le             # PowerPC little endian (POWER8 and newer)
            debian_arch: ppc64el      # the name of Debian, in the .tar.gz and the .deb
            platform: linux/ppc64le
            image: debian:trixie
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # the version comes from the nearest git tag

      - name: Set up QEMU
        if: ${{ !matrix.ports }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      # debian-ports has no Docker image of ppc64: the root file system is made
      # with debootstrap (the second stage runs emulated) and imported
      - name: Make the Debian ports image
        if: matrix.ports
        run: |
          sudo apt-get update
          # qemu-user-static of Ubuntu, not setup-qemu-action: the binfmt image of
          # that one has no big endian ppc64
          sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static
          # the keyring of Ubuntu is older than the key that signs sid today
          KEYRING=debian-ports-archive-keyring_2026.02.04_all.deb
          curl -fsSLO https://deb.debian.org/debian/pool/main/d/debian-ports-archive-keyring/$KEYRING
          dpkg-deb -x $KEYRING keyring
          sudo debootstrap --arch=${{ matrix.arch }} --variant=minbase \
            --keyring=$PWD/keyring/usr/share/keyrings/debian-ports-archive-keyring.gpg \
            sid rootfs http://ftp.ports.debian.org/debian-ports || {
              sudo tail -n 30 rootfs/debootstrap/debootstrap.log
              sudo chroot rootfs /bin/true || true
              file rootfs/bin/true; cat /proc/sys/fs/binfmt_misc/qemu-ppc64 || true
              exit 1
            }
          sudo tar -C rootfs -c . | docker import --platform ${{ matrix.platform }} - ${{ matrix.image }}
          sudo rm -rf rootfs keyring

      - name: Build the archive
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src ${{ matrix.image }} \
            sh -c 'scripts/build-tarball.sh && scripts/build-deb.sh && scripts/build-appimage-ports.sh appdir'
          sudo chown -R "$(id -u):$(id -g)" build-tarball

      # appimagetool for x86_64 packs the AppDir of the architecture: no emulation
      - name: Pack the AppImage
        run: scripts/build-appimage-ports.sh pack ${{ matrix.arch }}

      - name: Test the AppImage
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src ${{ matrix.image }} \
            scripts/build-appimage-ports.sh test

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ritmo-Linux-${{ matrix.arch }}
          path: |
            build-tarball/Ritmo-Linux-${{ matrix.debian_arch || matrix.arch }}-*.tar.gz
            build-tarball/ritmo_*.deb
            build-tarball/ritmo-linux.png
            build-tarball/Ritmo-*-${{ matrix.arch }}.AppImage
            build-tarball/Ritmo-*-${{ matrix.arch }}.AppImage.zsync
            build-tarball/ritmo-appimage.png

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build-tarball/Ritmo-Linux-${{ matrix.debian_arch || matrix.arch }}-*.tar.gz
            build-tarball/ritmo_*.deb
            build-tarball/Ritmo-*-${{ matrix.arch }}.AppImage
            build-tarball/Ritmo-*-${{ matrix.arch }}.AppImage.zsync
          prerelease: ${{ contains(github.ref_name, '-rc') }}   # v2.0-rcN of scripts/push.sh
