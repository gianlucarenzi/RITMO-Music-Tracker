name: Build RITMO on macOS

# The Qt6 frontend built with Apple Clang, twice on an Apple Silicon runner,
# both with the official Qt 6 (clang_64: universal, arm64 and x86_64):
# - arm64: native, with PortAudio and RtMidi from Homebrew
# - x86_64: for Intel Macs (and Apple Silicon through Rosetta 2). Homebrew no
#   longer installs on Intel, so PortAudio and RtMidi are built from their
#   sources for x86_64
# PortAudio plays the sound, RtMidi is the MIDI IN (CoreMIDI). The result is
# Ritmo.app in a DMG: macdeployqt puts the Qt frameworks and the libraries into
# the bundle, so nothing has to be installed to run it; the bundle is signed
# ad hoc (not notarized: the first time it is opened with right click ->
# Open). The program finds its resources/ next to itself (Contents/MacOS),
# like out/ of the build; the configuration is in the user's preferences
# (QSettings), so a new DMG keeps it. A tag v* builds and publishes both.

on:
  push:
    tags: ['v*']
  workflow_dispatch:           # manual test runs: the artifacts only, no release

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3            # LTS; needs macOS 12
  MACOS_MIN: '12.0'
  PORTAUDIO_VERSION: v19.7.0
  RTMIDI_VERSION: 6.0.0

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    env:
      ARCH: ${{ matrix.arch }}
      DEPS: ${{ github.workspace }}/deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the version comes from the nearest git tag

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          dir: ${{ runner.temp }}
          setup-python: true

      # --- arm64: Homebrew ---------------------------------------------------

      - name: Install dependencies (Homebrew)
        if: matrix.arch == 'arm64'
        run: |
          brew install portaudio rtmidi pkgconf ninja
          echo "QT_PREFIX=$QT_ROOT_DIR" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix)" >> $GITHUB_ENV
          echo "RUN=" >> $GITHUB_ENV

      # --- x86_64: PortAudio and RtMidi from source ---------------------------

      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Build PortAudio and RtMidi (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          brew install ninja
          # Absolute install names, so that macdeployqt finds and bundles them
          COMMON="-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
                  -DCMAKE_INSTALL_PREFIX=$DEPS -DCMAKE_INSTALL_NAME_DIR=$DEPS/lib
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_MIN -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          # (CMAKE_POLICY_VERSION_MINIMUM: PortAudio 19.7.0 asks for CMake 2.8,
          # refused by CMake 4)
          git clone --depth 1 --branch $PORTAUDIO_VERSION https://github.com/PortAudio/portaudio.git portaudio-src
          cmake -S portaudio-src -B portaudio-build $COMMON -DBUILD_SHARED_LIBS=ON
          cmake --build portaudio-build
          cmake --install portaudio-build
          git clone --depth 1 --branch $RTMIDI_VERSION https://github.com/thestk/rtmidi.git rtmidi-src
          cmake -S rtmidi-src -B rtmidi-build $COMMON -DBUILD_SHARED_LIBS=ON \
            -DRTMIDI_API_CORE=ON -DRTMIDI_API_JACK=OFF -DRTMIDI_BUILD_TESTING=OFF
          cmake --build rtmidi-build
          cmake --install rtmidi-build
          ls -la $DEPS/lib $DEPS/include
          echo "QT_PREFIX=$QT_ROOT_DIR" >> $GITHUB_ENV        # set by install-qt-action
          echo "CMAKE_PREFIX_PATH=$DEPS;$QT_ROOT_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$DEPS/lib/pkgconfig" >> $GITHUB_ENV
          echo "RUN=arch -x86_64" >> $GITHUB_ENV

      # --- both --------------------------------------------------------------

      - name: Configure
        run: |
          # The arm64 Homebrew of the runner must not be used by the x86_64 build
          IGNORE=
          [ "$ARCH" = x86_64 ] && IGNORE="-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=$ARCH -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_MIN \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" $IGNORE

      - name: Build
        run: |
          cmake --build build --parallel
          file build/out/ritmo

      - name: Smoke test (offscreen, screenshot of gemx.rmt)
        run: |
          QT_QPA_PLATFORM=offscreen RMT_QT_GRAB=$PWD/ritmo-macos-$ARCH.png RMT_QT_GRAB_MS=3000 \
            $RUN ./build/out/ritmo rmt/songs/rmt128/raster/gemx.rmt || true
          test -f ritmo-macos-$ARCH.png

      - name: Make Ritmo.app
        run: |
          APP=dist/Ritmo.app
          VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp build/out/ritmo $APP/Contents/MacOS/ritmo
          cp -R build/out/resources $APP/Contents/MacOS/
          ICON=
          if sips -s format icns src/res/ritmo-icon-512.png --out $APP/Contents/Resources/Ritmo.icns >/dev/null 2>&1; then
            ICON="<key>CFBundleIconFile</key><string>Ritmo</string>"
          fi
          cat > $APP/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ritmo</string>
            <key>CFBundleIdentifier</key><string>org.ritmo-atari.ritmo</string>
            <key>CFBundleName</key><string>Ritmo</string>
            <key>CFBundleDisplayName</key><string>RITMO</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOS_MIN}</string>
            <key>NSHighResolutionCapable</key><true/>
            ${ICON}
          </dict>
          </plist>
          PLIST
          plutil -lint $APP/Contents/Info.plist
          # xcrun (behind /usr/bin/otool, install_name_tool, strip) builds its
          # cache on the first call of each tool; that can take longer than
          # the time macdeployqt gives them (it did with the x86_64-only
          # macdeployqt of Qt 5.15.2, through Rosetta), and then it deploys
          # nothing: do the first calls here. No strip: the Release
          # binaries have nothing to strip
          for tool in otool install_name_tool; do
            time xcrun --find $tool
            time arch -x86_64 /usr/bin/xcrun --find $tool || true
          done
          otool -L build/out/ritmo
          "$QT_PREFIX/bin/macdeployqt" $APP -always-overwrite -no-strip -verbose=2 2>&1 | tee macdeployqt.log
          grep -q 'Destroyed while process' macdeployqt.log && echo "::warning::macdeployqt: a tool did not answer in time"
          if grep -q '^ERROR' macdeployqt.log; then echo "macdeployqt failed"; exit 1; fi
          # No library may still be loaded from Homebrew or the build folders:
          # the load commands only (otool -L also lists the install name of a
          # dylib itself, which macdeployqt leaves as it was)
          OUTSIDE=$(find $APP -type f \( -perm +111 -o -name '*.dylib' \) | while read f; do
            otool -l "$f" 2>/dev/null | awk '/cmd LC_(LOAD|LOAD_WEAK|REEXPORT)_DYLIB/ { getline; getline; print $2 }' \
              | grep -E "^(/opt/homebrew|/usr/local|$DEPS)/" | sed "s#^#$f: #"
          done)
          if [ -n "$OUTSIDE" ]; then
            echo "$OUTSIDE"; echo "Ritmo.app still uses libraries outside the bundle"; exit 1
          fi
          codesign --force --deep --sign - $APP
          codesign --verify --deep --verbose=2 $APP

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R dist/Ritmo.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "RITMO" -srcfolder dmg -ov -format UDZO "Ritmo-macOS-$ARCH-$(scripts/package-version.sh).dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ritmo-macOS-${{ matrix.arch }}
          path: |
            Ritmo-macOS-${{ matrix.arch }}-*.dmg
            ritmo-macos-${{ matrix.arch }}.png

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Ritmo-macOS-${{ matrix.arch }}-*.dmg
          prerelease: ${{ contains(github.ref_name, '-rc') }}   # v2.0-rcN of scripts/push.sh
