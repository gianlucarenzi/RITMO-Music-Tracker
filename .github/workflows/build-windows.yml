name: Build RITMO on Windows

# The Qt6 frontend built with MSYS2 / MinGW-w64 (GCC, like the Linux build):
# Qt6, PortAudio (sound) and RtMidi (MIDI IN through WinMM) are MSYS2
# packages. The result is a folder with Ritmo.exe, its resources and all the
# DLLs it needs, zipped, and an installer made with Inno Setup
# (scripts/ritmo.iss); a tag v* builds them and publishes them as release
# assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:           # manual test runs: the artifacts only, no release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the version comes from the nearest git tag

      - name: Install MSYS2 and the dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-tools:p
            portaudio:p
            rtmidi:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRMT_QT_MAJOR=6

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test (offscreen, screenshot of gemx.rmt)
        run: |
          QT_QPA_PLATFORM=offscreen RMT_QT_GRAB=$PWD/ritmo-windows.png RMT_QT_GRAB_MS=3000 \
            timeout 120 ./build/out/Ritmo.exe rmt/songs/rmt128/raster/gemx.rmt || true
          test -f ritmo-windows.png

      - name: Package
        run: |
          DIST=dist/Ritmo
          mkdir -p $DIST
          cp build/out/Ritmo.exe $DIST/
          cp -r build/out/resources $DIST/
          WINDEPLOYQT=$(command -v windeployqt-qt6 || command -v windeployqt6 \
            || ls /mingw64/share/qt6/bin/windeployqt.exe)
          # RMT draws with the raster engine: no software OpenGL (not in MSYS2;
          # ANGLE is gone in Qt6)
          "$WINDEPLOYQT" --release --no-translations --compiler-runtime --no-opengl-sw $DIST/Ritmo.exe
          # The MinGW DLLs of the program and of the Qt DLLs and plugins,
          # until nothing new is found
          for pass in 1 2 3 4 5; do
            find $DIST -iname '*.exe' -o -iname '*.dll' | while read f; do
              ldd "$f" | awk '{print $3}' | grep -i '^/mingw64/' || true
            done | sort -u | while read dll; do
              [ -f "$DIST/$(basename "$dll")" ] || cp "$dll" $DIST/
            done
          done
          ls -la $DIST
          # the version in the names of the ZIP and of the installer
          echo "RITMO_PKG_VERSION=$(scripts/package-version.sh)" >> "$GITHUB_ENV"

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path dist/Ritmo -DestinationPath "Ritmo-Windows-x64-$env:RITMO_PKG_VERSION.zip" -Force

      - name: Create the installer (Inno Setup)
        shell: pwsh
        run: |
          # the version of the program, as the build wrote it
          $version = (Select-String -Path build/RmtVersion.h -Pattern 'RMT_VERSION_FULL\s+"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Version: $version"
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
              choco install innosetup -y --no-progress
              $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe (Inno Setup) not found" }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\Ritmo" "/O$PWD" "/FRitmo-Windows-x64-Setup-$env:RITMO_PKG_VERSION" scripts\ritmo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item "Ritmo-Windows-x64-Setup-$env:RITMO_PKG_VERSION.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ritmo-Windows-x64
          path: |
            Ritmo-Windows-x64-*.zip
            Ritmo-Windows-x64-Setup-*.exe
            ritmo-windows.png

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Ritmo-Windows-x64-*.zip
            Ritmo-Windows-x64-Setup-*.exe
          prerelease: ${{ contains(github.ref_name, '-rc') }}   # v2.0-rcN of scripts/push.sh
