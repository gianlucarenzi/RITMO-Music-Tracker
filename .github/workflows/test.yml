name: Test RITMO on Linux

# The Qt6 frontend built with the distribution's packages, then the checks that
# need no display (Qt draws offscreen): the menu test of the frontend (every menu
# item and toolbar button is triggered and has a handler) and the scripting tests
# (scripts/test-scripting.sh: the reference scripts run twice and compared, the
# exit codes, the structure of the SAP type B files). The engine without Qt
# (RmtCoreTest) checks the note input of MIDI channel 16. The drivers and their C headers are assembled again
# from the 6502 sources with ca65 (asm/ca65) and must be those of rmt/resources/drivers and src/.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the version comes from the nearest git tag

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qt6-base-dev portaudio19-dev librtmidi-dev libgl1-mesa-dev python3 cc65

      - name: Build
        run: |
          cmake -B build-qt -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qt -j"$(nproc)"

      - name: Menu test of the frontend
        run: |
          cd build-qt/out
          RMT_QT_GRAB=/tmp/ritmo-menu.png RMT_QT_GRAB_MS=30000 RMT_QT_MENU_TEST=1 QT_QPA_PLATFORM=offscreen ./ritmo 2>&1 | tee /tmp/menu-test.log
          grep -q "RMT_QT_MENU_TEST: PASS" /tmp/menu-test.log

      - name: Scripting tests
        run: scripts/test-scripting.sh build-qt/out/ritmo

      - name: MIDI channel 16 test of the engine
        run: |
          cmake -B build-core -DCMAKE_BUILD_TYPE=Release -DRMT_BUILD_CORE_ONLY=ON -DRMT_CORE_TEST=ON
          cmake --build build-core -j"$(nproc)" --target RmtCoreTest
          build-core/out/RmtCoreTest --midi16

      - name: The drivers and their C headers from the 6502 sources
        run: make -C asm/ca65 check

      - name: Keep the outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: /tmp/menu-test.log
