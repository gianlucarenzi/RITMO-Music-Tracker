name: Build RITMO on Linux

# The Qt6 frontend as an AppImage, for two architectures:
# - x86_64, built in an Ubuntu 20.04 container: its glibc 2.31 is the one of
#   Debian 11, so the AppImage runs there and on every newer distribution
#   (scripts/build-appimage.sh checks it). The runner ubuntu-20.04 is gone,
#   the container gives the same system.
# - aarch64 (Raspberry Pi 3/4/5 with a 64 bit system), on the ARM64 runner of
#   GitHub in an Ubuntu 22.04 container: the official Qt 6 for ARM64 needs
#   glibc 2.35, so it runs on Raspberry Pi OS 12 (bookworm) and newer.
# The official Qt 6, PortAudio and RtMidi go into the AppImage with
# linuxdeploy. A tag v* builds them and publishes them as release assets;
# started by hand it only keeps them as artifacts.

on:
  push:
    tags: ['v*']
    branches: ['ci/**']        # test runs of the workflows: the artifacts only, no release
  workflow_dispatch:           # manual test runs: the artifacts only, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: ubuntu:20.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    steps:
      - name: Install git
        # before the checkout: without git it downloads the sources with no
        # history, and the version comes from the nearest git tag
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the AppImage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          WORK=$GITHUB_WORKSPACE/build-appimage scripts/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ritmo-Linux-${{ matrix.arch }}
          path: |
            build-appimage/Ritmo-Linux-${{ matrix.arch }}.AppImage
            build-appimage/ritmo-linux.png

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build-appimage/Ritmo-Linux-${{ matrix.arch }}.AppImage
          prerelease: ${{ contains(github.ref_name, '-rc') }}   # v2.0-rcN of scripts/push.sh
